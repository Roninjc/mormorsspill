# Litestream configuration (continuous backup of the SQLite DB to the cloud).
# Only used if you set LITESTREAM_REPLICA_URL and credentials (see docker-compose / DEPLOY.md).
# Replica URL examples:
#   Cloudflare R2 / S3:  s3://my-bucket/mormorsspill
#   Backblaze B2:        s3://my-bucket/mormorsspill   (with a B2 endpoint)
dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}
        # For R2/B2 you must set the endpoint (native S3 doesn't need it):
        endpoint: ${LITESTREAM_ENDPOINT}
        # Region (R2 uses 'auto'):
        region: ${LITESTREAM_REGION}
