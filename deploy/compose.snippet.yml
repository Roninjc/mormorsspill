  mormorsspill:
    image: ghcr.io/roninjc/mormorsspill:latest
    container_name: mormorsspill
    restart: unless-stopped
    environment:
      PORT: 3000
      ORIGIN: https://mormorsspill.YOUR-DOMAIN.com
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      DATABASE_PATH: /data/mormorsspill.db
      SESSION_SECRET_PATH: /data/.session_secret
      # --- Litestream (optional: fill in to enable cloud backup) ---
      # LITESTREAM_REPLICA_URL: s3://my-bucket/mormorsspill
      # LITESTREAM_ENDPOINT: https://<accountid>.r2.cloudflarestorage.com
      # LITESTREAM_REGION: auto
      # LITESTREAM_ACCESS_KEY_ID: xxxxxxxx
      # LITESTREAM_SECRET_ACCESS_KEY: xxxxxxxx
    volumes:
      - mormorsspill-data:/data
    # Exposed on the LAN so the separate nginx VM can reach it (same pattern as worldwide's 9000).
    # Your reverse proxy routes the subdomain here (with WS upgrade).
    ports:
      - "3000:3000"

# In the central compose.yml's volumes: section, add:
# volumes:
#   mormorsspill-data:
